<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Channel Page</title>
  </head>
  <body>
    <header class="header">
      <div class="header__left">
        <button class="header__menu">
          <img src="./assets/icons/menu.svg" alt="Menu" />
        </button>
        <a href="#" class="header__logo">
          <img src="./assets/logo.png" alt="logo" />
        </a>
        <label for="search-input" class="header__search">
          <input
            type="text"
            class="header__search-input"
            id="search-input"
            placeholder="Search"
          />
          <img
            src="./assets/icons/search.svg"
            alt="search"
            class="header__search-icon"
          />
        </label>
      </div>
      <div class="header__right">
        <div class="header__icons">
          <a href="#" class="button--icon"
            ><img src="./assets/icons/camera.svg" alt="camera"
          /></a>
          <a href="#" class="button--icon"
            ><img src="./assets/icons/expand.svg" alt="menu"
          /></a>
          <a href="#" class="header__notifications button--icon">
            <span class="header__notification-count">3</span>
            <img src="./assets/icons/notifications.svg" alt="notifications" />
          </a>
        </div>
        <a href="#" class="header__avatar">
          <img src="./assets/avatars/avatar-1.png" alt="avatar" />
        </a>
      </div>
    </header>
  </body>
</html>
