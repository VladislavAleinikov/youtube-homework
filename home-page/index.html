<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube | Home</title>
  </head>
  <body>
    <header class="header">
      <div class="header__left">
        <button class="header__menu">
          <img src="./assets/icons/menu.svg" alt="Menu" />
        </button>
        <a href="#" class="header__logo">
          <img src="./assets/logo.png" alt="logo" />
        </a>
        <div class="header__search">
          <input type="text" class="header__search-input" />
          <img
            src="./assets/icons/search.svg"
            alt="search"
            class="header__search-icon"
          />
        </div>
      </div>
      <div class="header__right">
        <div class="header__icons">
          <a href="#"><img src="./assets/icons/camera.svg" alt="camera" /></a>
          <a href="#"><img src="./assets/icons/expand.svg" alt="menu" /></a>
          <a href="#" class="header__notifications">
            <span class="header__notification-count">3</span>
            <img src="./assets/icons/notifications.svg" alt="notifications" />
          </a>
        </div>
        <a href="#" class="header__avatar">
          <img src="./assets/avatar-1.png" alt="avatar " />
        </a>
      </div>
    </header>
    <aside class="aside">
      <ul class="aside__main-links">
        <li class="aside__links-item">
          <a href="#" class="aside__link link--active">
            <img
              src="./assets/icons/home.svg"
              alt="home"
              class="aside__link-icon"
            />
            <span>Home</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/tranding.svg"
              alt="tranding"
              class="aside__link-icon"
            />
            <span>Trending</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/subscriptions.svg"
              alt="subscriptions"
              class="aside__link-icon"
            />
            <span>Subscriptions</span>
          </a>
        </li>
      </ul>
      <ul class="aside__links">
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/library.svg"
              alt="library"
              class="aside__link-icon"
            />
            <span>Library</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/history.svg"
              alt="history"
              class="aside__link-icon"
            />
            <span>History</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/watch-later.svg"
              alt="watch-later"
              class="aside__link-icon"
            />
            <span>Watch later</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/favourites.svg"
              alt="favourites"
              class="aside__link-icon"
            />
            <span>Favourites</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/like.svg"
              alt="like"
              class="aside__link-icon"
            />
            <span>Liked videos</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/music.svg"
              alt="music"
              class="aside__link-icon"
            />
            <span>Music</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/games.svg"
              alt="games"
              class="aside__link-icon"
            />
            <span>Games</span>
          </a>
        </li>
        <li class="aside__links-item">
          <a href="#" class="aside__link">
            <img
              src="./assets/icons/chevron-down.svg"
              alt="chevron-down"
              class="aside__link-icon"
            />
            <span>Show more</span>
          </a>
        </li>
      </ul>
      <div class="aside__subs">
        <h3 class="aside__subs-title">Subscriptions</h3>
        <ul class="aside__subs-list">
          <li class="aside__sub">
            <img
              src="./assets/avatars/avatar-2.png"
              alt="avatar"
              class="aside__sub-avatar"
            />
            <span>Gussie Singleton</span>
          </li>
          <li class="aside__sub">
            <img
              src="./assets/avatars/avatar-3.png"
              alt="avatar"
              class="aside__sub-avatar"
            />
            <span>Nora Francis</span>
          </li>
          <li class="aside__sub">
            <img
              src="./assets/avatars/avatar-4.png"
              alt="avatar"
              class="aside__sub-avatar"
            />
            <span>Belle Briggs</span>
          </li>
          <li class="aside__sub">
            <img
              src="./assets/avatars/avatar-5.png"
              alt="avatar"
              class="aside__sub-avatar"
            />
            <span>Eunice Cortez</span>
          </li>
          <li class="aside__sub">
            <img
              src="./assets/avatars/avatar-6.png"
              alt="avatar"
              class="aside__sub-avatar"
            />
            <span>Emma Hanson</span>
          </li>
          <li class="aside__sub">
            <img
              src="./assets/avatars/avatar-7.png"
              alt="avatar"
              class="aside__sub-avatar"
            />
            <span>Leah Berry</span>
          </li>
        </ul>
        <a href="#" class="aside__setting">
          <img
            src="./assets/icons/setting.svg"
            alt="setting"
            class="aside__setting-icon"
          />
          <span>Setting</span>
        </a>
      </div>
    </aside>
  </body>
</html>
